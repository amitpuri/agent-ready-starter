name: Agent context check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check agent context files
        run: bash ./scripts/check-agent-context.sh
        # While you're still filling in the template, uncomment to report FILL markers as warnings:
        # env:
        #   ALLOW_FILL: "1"
